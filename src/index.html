<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF1E3">

<title>Our Kitchen</title>
<style>
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-wght-normal.woff2) format('woff2');font-weight:200 1000;font-display:swap}
:root{--bg:#FAF1E3;--card:#fff;--ink:#3A2A1F;--mute:#7A6354;--line:#EFE0CB;--edge:#CDB594;--acc:#E7855B;--butter:#F4C86A;--sage:#A9C79A;--duck:#9CC5C4;--plum:#D2A8B8;--apricot:#F5BE95;--warn:#B5532E;--warn-soft:#F6DCCB;--bad:#B3261E;--tint:#F6EBCB;--shadow:0 4px 14px rgba(90,55,30,.14);--shadow2:0 2px 6px rgba(90,55,30,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#1F1812;--card:#2B2119;--ink:#F4E9DA;--mute:#BBA896;--line:#3B2E23;--edge:#5A4838;--warn:#F0A27C;--warn-soft:#3F2A1E;--bad:#FF9A8F;--tint:#3A3020;--shadow:none;--shadow2:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Nunito',system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Fraunces',Georgia,"Noto Serif",serif;font-weight:700;margin:0}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
#top h1{font-size:30px;line-height:1.05;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.ok{background:var(--sage)}.dot.saving{background:var(--butter)}.dot.error{background:var(--bad)}
.sync{font-size:13px;color:var(--mute);margin-right:8px}
main{padding:0 14px}
.ic{border:0;background:transparent;font-size:24px;min-width:48px;height:48px;border-radius:50%;cursor:pointer}
.ic:active{background:var(--line)}
.btn{border:1.5px solid var(--edge);background:var(--card);border-radius:999px;padding:0 18px;min-height:48px;cursor:pointer;font-weight:800}
.btn.pri{background:var(--acc);color:#3A2A1F;box-shadow:var(--shadow2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:0 14px;min-height:44px;font-size:15px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
.card.dash{border-style:dashed;border-color:var(--ink);box-shadow:none}
.pad{padding:14px 16px}
.mute{color:var(--mute)}.small{font-size:14px}
.chip{display:inline-block;font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:#fff;color:#3A2A1F;border:1.5px solid var(--edge);margin:2px 4px 2px 0;white-space:nowrap}
.chip.good{background:var(--sage)}.chip.warn{background:var(--butter)}.chip.bad{background:var(--acc)}.chip.duck{background:var(--duck)}.chip.plum{background:var(--plum)}.chip.dash{border-style:dashed;border-color:#3A2A1F}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--edge);background:var(--card);border-radius:16px;padding:10px 14px}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.weeknav div{text-align:center}.weeknav small{display:block;color:var(--mute)}
.day{padding:10px 14px;border-bottom:1.5px solid var(--line)}
.day:last-child{border:0}
.day .dn{font-weight:800}.day.today{background:var(--tint)}
.slot{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;min-height:48px}
.slot .mt{width:68px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.slot .empty{color:var(--mute);font-style:italic}
.seg{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.seg button{white-space:nowrap}
.seg .on{background:var(--butter);color:#3A2A1F;border-color:var(--edge)}
.sticky{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:3}
.cat{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 4px 6px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid var(--line);min-height:48px}
.item:last-child{border:0}
.item.out{opacity:.55}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:var(--card);cursor:pointer;font-size:20px;line-height:1}
.step span{min-width:54px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800}
.chk{width:26px;height:26px;accent-color:var(--ink)}
.done{text-decoration:line-through;color:var(--mute)}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--edge);display:flex;justify-content:center;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
#nav .in{display:flex;width:100%;max-width:640px;gap:4px}
#nav button{flex:1;border:0;background:transparent;min-height:56px;border-radius:18px;font-size:13px;font-weight:800;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
#nav button.on{background:var(--butter);color:#3A2A1F}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(58,42,31,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border:1.5px solid var(--edge);border-radius:30px 30px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom))}
.grab{width:48px;height:5px;border-radius:3px;background:var(--edge);margin:4px auto 12px}
.panel h2{font-size:28px;line-height:1.1;margin:4px 0 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;z-index:20;max-width:90%;display:none;font-size:15px;font-weight:700}
.banner{background:var(--warn-soft);color:var(--warn);padding:12px 14px;border-radius:16px;margin:8px 0;font-size:14.5px;font-weight:700}
.ing{display:flex;gap:8px;padding:5px 0;align-items:baseline}
.ing .q{min-width:72px;color:var(--mute)}
ol.steps{padding-left:22px;margin:6px 0}ol.steps li{margin:8px 0}
.empty-state{text-align:center;padding:36px 20px;color:var(--mute)}
.empty-state h3{color:var(--ink);margin-bottom:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.hero{background:var(--butter);color:#3A2A1F;border:1.5px solid var(--edge);border-radius:26px;box-shadow:var(--shadow);padding:18px;margin:10px 0}
.hero .lab{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero h2{font-size:28px;line-height:1.1;margin:4px 0 10px}
.hero .btn:not(.pri){background:#fff;color:#3A2A1F}
.sec{font:700 24px/1.1 'Fraunces',Georgia,serif;margin:24px 2px 8px}
.sec small{display:block;font:700 14px 'Nunito',sans-serif;color:var(--mute);margin-top:2px}
.pillhd{display:inline-block;padding:3px 14px;border:1.5px solid var(--edge);border-radius:99px;font:700 19px 'Fraunces',Georgia,serif;color:#3A2A1F}
.wk{display:flex;gap:6px}
.wk button{flex:1;min-width:0;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--card);border:1.5px solid var(--edge);border-radius:16px;font-weight:800;cursor:pointer}
.wk .today{background:var(--butter);color:#3A2A1F}
.wk i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--edge);background:var(--plum)}
.wk i.e{background:transparent;border:1.5px dashed var(--mute)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--card);border:1.5px solid var(--edge);border-radius:18px;margin-top:8px;min-height:48px;cursor:pointer}
.opt.on{background:var(--tint)}
.opt .chk{flex:none;margin:2px 0 0}
#cook{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
#cook[hidden]{display:none}
.cbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px}
.cbar h3{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segp{display:flex;gap:6px;padding:0 16px}
.segp i{flex:1;height:8px;border-radius:99px;background:var(--line);border:1px solid var(--edge)}
.segp i.on{background:var(--acc)}.segp i.cur{background:var(--butter)}
.cstep{margin:16px;padding:20px;background:var(--card);border:1.5px solid var(--edge);border-radius:26px;box-shadow:var(--shadow);font:700 23px/1.38 'Nunito',sans-serif}
.tm{border:0;border-bottom:2px dashed var(--ink);background:var(--butter);color:#3A2A1F;font:inherit;font-weight:800;padding:0 6px;border-radius:8px;cursor:pointer}
.cnote{margin:0 16px 10px;padding:12px 14px;background:var(--tint);border:1.5px solid var(--edge);border-radius:18px;font-weight:700}
.ctimer{margin:0 16px 12px;padding:16px;background:var(--duck);color:#3A2A1F;border:1.5px solid var(--edge);border-radius:22px;text-align:center}
.ctimer .big{font:700 44px/1.1 'Fraunces',Georgia,serif}
.ctimer .btn{background:#fff;color:#3A2A1F}.ctimer .btn.pri{background:var(--acc)}
.cnav{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;padding:12px 16px calc(20px + env(safe-area-inset-bottom));background:var(--card);border-top:1.5px solid var(--edge)}
.cnav .btn{min-height:60px;font-size:20px}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <main id="main"></main>
</div>
<nav id="nav"><div class="in"></div></nav>
<div id="sheet" class="scrim" hidden><div class="panel"><div class="grab"></div><div id="sheetbody"></div></div></div>
<div id="cook" hidden></div>
<div id="toast"></div>

<script>
/*LOGIC_START*/
const UNIT_ALIASES={g:'g',gram:'g',grams:'g',kg:'kg',kilogram:'kg',kilograms:'kg',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',ml:'ml',milliliter:'ml',milliliters:'ml',l:'l',liter:'l',liters:'l',litre:'l',litres:'l',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',tbsp:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',cup:'cup',cups:'cup',can:'can',cans:'can',clove:'clove',cloves:'clove',bunch:'bunch',bunches:'bunch',pinch:'pinch',slice:'slice',slices:'slice',pkg:'pack',package:'pack',packages:'pack',pack:'pack',packs:'pack',bag:'bag',bags:'bag',bottle:'bottle',bottles:'bottle',jar:'jar',jars:'jar',head:'head',heads:'head',stick:'stick',sticks:'stick',dozen:'dozen',piece:'',pieces:'',pc:'',pcs:'',each:''};
const UNIT_DIM={g:['w',1],kg:['w',1000],oz:['w',28.3495],lb:['w',453.592],ml:['v',1],l:['v',1000],tsp:['v',4.92892],tbsp:['v',14.7868],cup:['v',236.588]};
const UNIT_LIST=['','g','kg','oz','lb','ml','l','tsp','tbsp','cup','can','clove','bunch','pinch','slice','pack','bag','bottle','jar','head','dozen'];
const MEALS=['breakfast','lunch','dinner','snack'];
const CATS=['Produce','Meat & fish','Dairy & eggs','Bakery','Dry goods','Canned & jars','Frozen','Spices & oils','Drinks','Household','Other'];
const STOP=new Set(['fresh','large','small','medium','chopped','diced','minced','sliced','ground','whole','boneless','skinless','organic','ripe','of','and','or','the','a','to','taste','for','finely','roughly','cooked','raw','dried','frozen','canned','clove','extra','virgin','optional','plus','more','about','freshly']);
const VULG={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};

function normUnit(u){u=String(u||'').toLowerCase().replace(/\./g,'').trim();return Object.prototype.hasOwnProperty.call(UNIT_ALIASES,u)?UNIT_ALIASES[u]:u}
function toBase(q,u){u=normUnit(u);const d=UNIT_DIM[u];return d?{dim:d[0],v:q*d[1]}:{dim:'u:'+u,v:q}}
function unitFactor(u){const d=UNIT_DIM[normUnit(u)];return d?d[1]:1}
function sing(w){if(w.length>3){if(w.endsWith('ies'))return w.slice(0,-3)+'y';if(/(oes|ches|shes|sses)$/.test(w))return w.slice(0,-2);if(w.endsWith('s')&&!w.endsWith('ss')&&!w.endsWith('us'))return w.slice(0,-1)}return w}
function toks(n){n=String(n||'').toLowerCase().replace(/\(.*?\)/g,' ').split(',')[0];return n.split(/[^a-zà-ÿ]+/).filter(Boolean).map(sing).filter(t=>t&&!STOP.has(t))}
function nameKey(n){return toks(n).sort().join(' ')}
// recipe ingredient matches a pantry item when every word of the ingredient appears in the pantry name
function nameMatch(ingName,pantryName){const a=toks(ingName),b=toks(pantryName);return a.length>0&&b.length>0&&a.every(t=>b.includes(t))}

function fmtQty(q){if(!q)return'';const w=Math.floor(q+1e-9);const f=q-w;const fr=[[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];let best=fr[0];for(const x of fr)if(Math.abs(f-x[0])<Math.abs(f-best[0]))best=x;if(Math.abs(f-best[0])<0.04){let ww=w;if(best[0]===1)ww++;return String((ww?ww:'')+best[1])||'0'}return String(Math.round(q*100)/100)}
function fmtAmt(q,u){return [fmtQty(q),u||''].filter(Boolean).join(' ')}
function numTok(t){if(/^\d+([.,]\d+)?$/.test(t))return parseFloat(t.replace(',','.'));if(/^\d+\/\d+$/.test(t)){const[a,b]=t.split('/');return b!=='0'?a/b:NaN}if(VULG[t]!==undefined)return VULG[t];const m=t.match(/^(\d+)([½¼¾⅓⅔⅛])$/);if(m)return +m[1]+VULG[m[2]];return NaN}
function parseIng(line){
  let t=String(line||'').trim().replace(/^[-•*]\s*/,'');if(!t)return null;
  const parts=t.split(/\s+/);let i=0,qty=0,unit='',got=false;
  while(i<parts.length){
    const p=parts[i];const n=numTok(p);
    if(!isNaN(n)){qty+=n;got=true;i++;continue}
    const rg=p.match(/^([\d./]+)[-–]([\d./]+)$/);
    if(rg&&!isNaN(numTok(rg[1]))){qty+=numTok(rg[1]);got=true;i++;continue}
    const m=p.match(/^(\d+(?:[.,]\d+)?)([a-zA-Z]+)$/);
    if(m&&!got){qty=parseFloat(m[1].replace(',','.'));got=true;parts[i]=m[2];continue}
    if(got&&(p==='-'||p==='–'||p==='to')&&i+1<parts.length&&!isNaN(numTok(parts[i+1]))){i+=2;continue}
    break;
  }
  if(got&&i<parts.length-1){const u=normUnit(parts[i].replace(/\.$/,''));if(Object.prototype.hasOwnProperty.call(UNIT_ALIASES,parts[i].toLowerCase().replace(/\.$/,''))||UNIT_DIM[u]){unit=u;i++}}
  if(parts[i]&&parts[i].toLowerCase()==='of'&&i<parts.length-1)i++;
  const name=parts.slice(i).join(' ').trim();
  if(!name)return null;
  return {name,qty:got?qty:0,unit};
}
function fmtIng(g){return [fmtQty(g.qty),g.unit,g.name].filter(Boolean).join(' ')}

const CAT_WORDS={
 'Spices & oils':'salt cumin paprika oregano thyme cinnamon turmeric nutmeg clove cardamom spice seasoning oil vinegar soy sauce sesame cayenne coriander curry masala',
 'Meat & fish':'chicken beef pork lamb turkey bacon sausage ham steak salmon tuna shrimp fish cod mince meatball prawn',
 'Dairy & eggs':'milk butter cheese yogurt yoghurt cream egg eggs parmesan mozzarella cheddar feta tofu',
 'Bakery':'bread bun tortilla bagel roll pita naan baguette',
 'Frozen':'ice frozen',
 'Canned & jars':'can tomato-paste broth stock jam salsa pickle olive',
 'Dry goods':'flour sugar rice pasta noodle oat lentil bean chickpea cereal quinoa couscous cornstarch yeast baking cracker nut almond walnut peanut honey',
 'Drinks':'juice wine beer coffee tea soda water',
 'Household':'paper towel soap detergent sponge foil wrap bag trash',
 'Produce':'onion garlic tomato potato carrot celery lettuce spinach kale pepper cucumber zucchini broccoli cauliflower mushroom lemon lime apple banana orange berry avocado ginger cilantro parsley basil scallion herb cabbage squash corn pea sprout eggplant fruit leek radish beet mango grape pear peach cilantro dill mint bok choy'
};
function guessCat(name){
  const n=String(name||'').toLowerCase();
  if(/bell pepper|chili pepper|green bean|jalape/.test(n))return'Produce';
  if(/black pepper|white pepper|peppercorn/.test(n))return'Spices & oils';
  const t=toks(n);
  for(const c of Object.keys(CAT_WORDS)){const ws=CAT_WORDS[c].split(' ');if(t.some(x=>ws.includes(x)))return c}
  return'Other';
}

function toVirtual(pantry){return pantry.filter(p=>p.staple||Number(p.qty)>0).map(p=>{const b=toBase(Number(p.qty)||0,p.unit);return{id:p.id,name:p.name,staple:!!p.staple,dim:b.dim,v:b.v,expires:p.expires||''}})}
function ingStatus(ing,factor,vp){
  const m=vp.filter(p=>nameMatch(ing.name,p.name));
  if(!m.length)return{s:'need'};
  if(m.some(p=>p.staple))return{s:'have'};
  if(!ing.qty)return{s:'have'};
  const b=toBase(ing.qty*factor,ing.unit);
  const same=m.filter(p=>p.dim===b.dim);
  if(!same.length)return{s:'some'};
  const have=same.reduce((a,p)=>a+p.v,0);
  if(have>=b.v*0.999)return{s:'have'};
  return have>0?{s:'part'}:{s:'need'};
}
function recipeStatus(r,factor,vp){
  const out=(r.ingredients||[]).map(g=>({g,...ingStatus(g,factor,vp)}));
  const need=out.filter(o=>o.s==='need'||o.s==='part').length;
  return{items:out,need,total:out.length};
}
function consumeVirtual(r,factor,vp){
  for(const g of r.ingredients||[]){
    if(!g.qty)continue;const b=toBase(g.qty*factor,g.unit);let left=b.v;
    for(const p of vp){if(left<=0)break;if(p.staple||p.dim!==b.dim||!nameMatch(g.name,p.name))continue;const take=Math.min(p.v,left);p.v-=take;left-=take}
  }
}
function daysUntil(iso,today){if(!iso)return 999;const a=new Date(iso+'T00:00:00'),b=new Date(today.getFullYear(),today.getMonth(),today.getDate());return Math.round((a-b)/864e5)}
function scoreRecipe(r,factor,vp,today,rnd){
  const st=recipeStatus(r,factor,vp);
  let cov=0;for(const o of st.items)cov+=o.s==='have'?1:o.s==='some'?0.8:o.s==='part'?0.5:0;
  cov=st.total?cov/st.total:0.5;
  let soon=0;
  for(const o of st.items){if(o.s==='need')continue;for(const p of vp){if(!p.staple&&p.expires&&nameMatch(o.g.name,p.name)&&daysUntil(p.expires,today)<=5){soon++;break}}}
  let sc=cov*10+Math.min(soon,3)*0.8+(r.fav?1:0)+rnd*1.5;
  if(r.lastCooked){const d=Math.round((today-new Date(r.lastCooked))/864e5);if(d<10)sc-=4;else if(d<21)sc-=1.5}
  return sc;
}
function isExcluded(r,avoid){
  return (avoid||[]).some(a=>{a=String(a).trim().toLowerCase();if(!a)return false;return(r.title||'').toLowerCase().includes(a)||(r.ingredients||[]).some(g=>nameMatch(a,g.name))});
}
function pickRecipe(meal,recipes,used,vp,factorOf,avoid,today,rng,rules){
  let cands=recipes.filter(r=>(r.meals&&r.meals.length?r.meals:['dinner']).includes(meal)&&!isExcluded(r,avoid));
  if(!cands.length)return null;
  if(rules&&rules.length){const clean=cands.filter(r=>!recipeRuleCheck(r,rules).never.length);if(clean.length)cands=clean}
  const fresh=cands.filter(r=>!used.has(r.id));
  const reuse=!fresh.length;
  if(reuse)cands=cands;else cands=fresh;
  const scored=cands.map(r=>({r,s:scoreRecipe(r,factorOf(r),vp,today,rng())-(reuse?6:0)})).sort((a,b)=>b.s-a.s);
  const top=scored.slice(0,3);
  const w=top.map((x,i)=>[1,0.5,0.25][i]);const tot=w.reduce((a,b)=>a+b,0);let x=rng()*tot;

/* ---- ingredient rules, recipe adaptation, buying advice ---- */
const STORES=['Whole Foods','Costco',"Trader Joe's",'Wegmans','Wilson Farms','Elias Country Store','Other'];
const USAGE_OPTS=[['never','Never','Not in the dish at all. Overrides the options below.'],['cooked','Cooked only','Sharpness cooked out, never raw'],['hidden','Hidden','Not visible when served: minced fine or blended'],['flavor','Flavor only','Use while cooking, take out before serving']];

 {id:'garlic',name:'Garlic',usage:['cooked','hidden'],aliases:['garlic','minced garlic','garlic paste'],prepared:false,swap:'',note:''},
 {id:'onion',name:'Onion',usage:['never'],aliases:['onion','shallot','leek','chive'],prepared:true,swap:'',note:''},
 {id:'scallion',name:'Scallion',usage:['flavor'],aliases:['scallion','green onion','spring onion'],prepared:false,swap:'',note:'Never as a garnish.'},
 {id:'powders',name:'Onion and garlic powder',usage:['never'],aliases:['onion powder','garlic powder','granulated garlic','granulated onion'],prepared:false,swap:'',note:'Too strong in flavor.'}
];
const PREPARED_RE=/\b(sauce|stock|broth|bouillon|gravy|paste|marinara|soup|dressing)\b/i;
const GARNISH_RE=/garnish|sprinkl|top(?:ped|ping)? with|to serve|for serving|on top/i;
function aliasRe(al){const w=String(al).toLowerCase().split(/[^a-zà-ÿ]+/).filter(Boolean);return w.length?new RegExp('\\b'+w.map(x=>x+'s?').join('\\s+')+'\\b','i'):null}

function ruleFor(name,rules){

function buyAdvice(p){

  const packs=Math.max(1,Math.ceil(p.needV/p.packV-1e-9)),left=packs*p.packV-p.needV;

/* ---- online recipes (TheMealDB) & text import ---- */
const MEALDB='https://www.themealdb.com/api/json/v1/1/';
async function mdb(path){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(MEALDB+path,{signal:ctl.signal});if(!r.ok)throw new Error('http');return await r.json()}finally{clearTimeout(t)}}
function splitSteps(txt){
  let L=String(txt||'').split(/\r?\n+/).map(x=>x.trim()).filter(x=>x.length>2&&!/^step\s*\d+\s*$/i.test(x)&&!/^\d+\s*$/.test(x));
  if(L.length<3&&L.join(' ').length>300)L=L.join(' ').split(/(?<=[.!?])\s+(?=[A-Z])/);
  return L.map(x=>x.replace(/^(step\s*\d+\s*[:.)-]?\s*|\d+\s*[.)]\s+)/i,'').trim()).filter(Boolean);
}
function fromMealDb(m){
  const ing=[];
  for(let i=1;i<=20;i++){
    const n=String(m['strIngredient'+i]||'').trim();if(!n)continue;
    const q=String(m['strMeasure'+i]||'').trim();const mm=parseIng((q||'')+' x');
    const hasQ=mm&&mm.qty>0;
    ing.push({name:n.toLowerCase(),qty:hasQ?mm.qty:0,unit:hasQ&&mm.name==='x'?mm.unit:''});
  }
  const cat=String(m.strCategory||'');
  const meals=/breakfast/i.test(cat)?['breakfast']:/dessert|starter|side|miscellaneous/i.test(cat)?['snack']:['dinner','lunch'];
  return cleanRecipe({title:m.strMeal,servings:4,time:0,meals,tags:[cat,m.strArea].concat(String(m.strTags||'').split(',')).map(x=>String(x||'').trim()).filter(Boolean).slice(0,5),ingredients:ing,steps:splitSteps(m.strInstructions),notes:'From TheMealDB'+(m.strSource?' · '+m.strSource:''),source:'themealdb'});
}
function cleanRecipe(x){
  if(!x||typeof x!=='object'||!x.title)return null;
  const meals=(Array.isArray(x.meals)?x.meals:['dinner']).filter(m=>MEALS.includes(m));
  return{title:String(x.title),servings:Math.max(1,+x.servings||2),time:Math.max(0,+x.time||0),meals:meals.length?meals:['dinner'],tags:(Array.isArray(x.tags)?x.tags:[]).map(String).slice(0,6),ingredients:(x.ingredients||[]).filter(g=>g&&g.name),steps:(x.steps||[]).map(String),notes:x.notes?String(x.notes):'',source:x.source||''};
}
function parseRecipeText(t){
  const lines=String(t).split(/\r?\n/).map(s=>s.replace(/^[\s•*▢☐□✓▪-]+/,'').trim()).filter(Boolean);
  const isIng=s=>/^ingredients?\b[\s:]*$/i.test(s),isStep=s=>/^(instructions?|directions?|method|steps?|preparation|how to make( it)?)\b[\s:]*$/i.test(s);
  const ii=lines.findIndex(isIng),si=lines.findIndex(isStep);let title='',ing=[],stp=[];
  const firstShort=arr=>arr.find(l=>l.length<90&&!/^\d/.test(l))||'';
  if(ii>=0&&si>ii){title=firstShort(lines.slice(0,ii));ing=lines.slice(ii+1,si);stp=lines.slice(si+1)}
  else if(si>=0&&ii>si){title=firstShort(lines.slice(0,si));stp=lines.slice(si+1,ii);ing=lines.slice(ii+1)}
  else if(ii>=0){title=firstShort(lines.slice(0,ii));ing=lines.slice(ii+1).filter(l=>l.length<90);stp=lines.slice(ii+1).filter(l=>l.length>=90)}
  else{title=lines[0]||'';const rest=lines.slice(1);ing=rest.filter(l=>/^(\d|[½¼¾⅓⅔⅛])/.test(l)&&l.length<90);stp=rest.filter(l=>!ing.includes(l)&&l.length>25)}
  const ingredients=ing.filter(l=>!/:$/.test(l)).map(parseIng).filter(Boolean);
  const steps=stp.map(l=>l.replace(/^(step\s*\d+\s*[:.)-]?\s*|\d+\s*[.)]\s+)/i,'').trim()).filter(l=>l.length>3);
  const sv=t.match(/(?:serves|servings?|yields?|makes)\s*:?\s*(\d+)/i)||t.match(/(\d+)\s*servings/i);
  const h=t.match(/(\d+)\s*(?:hrs?|hours?)/i),mn=t.match(/(\d+)\s*(?:mins?|minutes?)/i);
  return{title:title||'Imported recipe',servings:sv?+sv[1]:cfg().servings,time:(h?+h[1]*60:0)+(mn?+mn[1]:0),meals:['dinner'],tags:[],ingredients,steps,notes:'Imported from pasted text'};
}

async function runFind(kind){
  const box=$('#f_res');if(!navigator.onLine){box.innerHTML='<div class="banner">You’re offline — connect to the internet to search for recipes.</div>';return}
  box.innerHTML='<div class="pad mute"><span class="spin"></span>Searching…</div>';
  try{
    let metas=[];
    if(kind==='name'){
      const q=$('#f_q').value.trim();if(!q){box.innerHTML='';toast('Type a dish or ingredient.');return}
      const byName=await mdb('search.php?s='+encodeURIComponent(q));metas=byName.meals||[];
      if(!metas.length){const byIng=await mdb('filter.php?i='+encodeURIComponent(q.toLowerCase().replace(/\s+/g,'_')));const ids=(byIng.meals||[]).slice(0,8).map(x=>x.idMeal);metas=(await Promise.all(ids.map(id=>mdb('lookup.php?i='+id)))).flatMap(r=>r.meals||[])}
    }else if(kind==='random'){
      metas=(await Promise.all([1,2,3,4].map(()=>mdb('random.php')))).flatMap(r=>r.meals||[]);
    }else{
      const items=pantryList().filter(p=>!p.staple&&+p.qty>0).sort((a,b)=>(a.expires||'9').localeCompare(b.expires||'9')).slice(0,4);
      if(!items.length){box.innerHTML='<div class="banner">Add some items to your pantry first.</div>';return}
      const lists=await Promise.all(items.map(p=>mdb('filter.php?i='+encodeURIComponent(toks(p.name).join('_'))).catch(()=>({meals:null}))));
      const ids=[...new Set(lists.flatMap(r=>(r.meals||[]).slice(0,5).map(x=>x.idMeal)))].slice(0,10);
      metas=(await Promise.all(ids.map(id=>mdb('lookup.php?i='+id)))).flatMap(r=>r.meals||[]);
    }
    const seen=new Set();const arr=metas.filter(m=>m&&!seen.has(m.idMeal)&&seen.add(m.idMeal)).map(fromMealDb).filter(Boolean);
    if(kind==='pantry'){const vp=toVirtual(pantryList());arr.sort((a,b)=>recipeStatus(a,factorOf(a),vp).need-recipeStatus(b,factorOf(b),vp).need)}
    if(!arr.length){box.innerHTML='<div class="banner">No recipes found — try another word.</div>';return}
    window._found=arr;showFound();
  }catch(e){box.innerHTML='<div class="banner">Couldn’t reach the recipe database. Check your connection and try again.</div>'}
}

/* ---- SHOPPING ---- */
function adviceFor(s){
  const p=S.products[nameKey(s.name)];if(!p||!(+p.packQty>0)||!(+s.qty>0))return null;
  const n=toBase(+s.qty,s.unit),k=toBase(+p.packQty,p.packUnit);if(n.dim!==k.dim)return null;
  return buyAdvice({needV:n.v,packV:k.v,shelfDays:+p.shelfDays||0,freezeOk:!!p.freezeOk});
}
function adviceChip(a){if(!a||!a.text)return'';const cls={fits:'duck',bulk:'good',freeze:'duck',skip:'bad'}[a.kind]||'';return`<span class="chip ${cls}">${esc(a.text)}</span>`}
function shopRow(s,showStore){
  const p=S.products[nameKey(s.name)];
  return`<div class="item" style="align-items:flex-start"><input class="chk" type="checkbox" data-a="scheck" data-id="${s.id}" ${s.checked?'checked':''} aria-label="In the cart" style="margin-top:3px"><div class="grow" data-a="openitem" data-n="${esc(s.name)}" style="cursor:pointer"><div class="${s.checked?'done':''}"><b>${esc(s.name)}</b> ${s.qty?`<span class="mute">· ${esc(fmtAmt(s.qty,s.unit))}</span>`:''}</div>${p&&p.pick?`<div class="small mute">${esc(p.pick)}${showStore&&p.store?' · '+esc(p.store):''}</div>`:''}${(()=>{const c=adviceChip(adviceFor(s))+(s.auto?'':'<span class="chip">added</span>');return c?`<div>${c}</div>`:''})()}</div><button class="ic" data-a="sdel" data-id="${s.id}" aria-label="Remove" style="color:var(--mute)">×</button></div>`;
}
function viewShop(){
  const list=shopList(),open=list.filter(s=>!s.checked),done=list.filter(s=>s.checked),mode=S.shopMode;
  const storeOf=s=>(S.products[nameKey(s.name)]||{}).store||'No store set';
  let h=`<div class="sticky"><div class="row"><input type="text" id="sadd" placeholder="Add item, e.g. “2 lemons”" enterkeyhint="done"><button class="btn pri" data-a="sadd">Add</button></div><div class="seg"><button class="btn sm ${mode==='store'?'on':''}" data-a="shopmode" data-m="store">By store</button><button class="btn sm ${mode==='aisle'?'on':''}" data-a="shopmode" data-m="aisle">By aisle</button></div></div>`;
  if(!list.length)h+=`<div class="card"><div class="empty-state"><h3>Nothing to buy</h3>Plan your week on the Menu tab, then build the list. It subtracts what’s already in your pantry.</div></div>`;
  else h+=`<div class="small mute" style="margin:2px 4px">${open.length} item${open.length===1?'':'s'} to buy${done.length?' · '+done.length+' in the cart':''}</div>`;
  if(mode==='store'){
    const by={};for(const s of open)(by[storeOf(s)]=by[storeOf(s)]||[]).push(s);
    const order=[...STORES,'No store set'].filter(k=>by[k]);
    h+=order.map(k=>`<div class="row" style="margin:20px 2px 8px"><span class="pillhd" style="background:${STORE_COLOR[k]||'var(--line)'}">${esc(k)}</span><span class="small mute">${by[k].length} item${by[k].length>1?'s':''}</span></div><div class="card">${by[k].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>shopRow(s,false)).join('')}</div>`).join('');
  }else{
    const by={};for(const s of open)(by[s.cat||'Other']=by[s.cat||'Other']||[]).push(s);
    h+=CATS.filter(c=>by[c]).map(c=>`<div class="cat">${c}</div><div class="card">${by[c].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>shopRow(s,true)).join('')}</div>`).join('');
  }
  if(done.length)h+=`<div class="cat">In the cart</div><div class="card">${done.map(s=>shopRow(s,true)).join('')}</div><button class="btn pri" style="width:100%;margin-bottom:8px" data-a="doneshop">Done shopping: move ${done.length} to pantry</button>`;
  h+=`<div class="row wrap" style="margin:8px 0 14px"><button class="btn grow" data-a="buildlist">Rebuild from menu</button>${list.length?'<button class="btn danger grow" data-a="clearlist">Clear list</button>':''}</div>`;
  if(list.length)h+=`<div class="small mute" style="margin:0 4px 14px">Tap an item for its best pick, pack size and how long it keeps.</div>`;
  return h;
}
function buildList(silent){
  const wkIso=isoDate(curWeek()),doc=S.menu[wkIso];
  const items=[];for(const s of Object.values((doc&&doc.slots)||{})){if(s.rid&&S.recipes[s.rid]){const er=effRecipe(S.recipes[s.rid]);items.push({recipe:{id:s.rid,...er},factor:factorOf(er)})}}
  const needs=computeNeeds(items,pantryList());
  const existing=Object.fromEntries(shopList().filter(s=>s.auto).map(s=>[s.id,s]));const seen=new Set();let n=0;
  for(const nd of needs){
    const id='a-'+safeId(nd.key)+'-'+safeId(nd.dim);seen.add(id);
    const nw={name:nd.name.replace(/\s*,.*$/,''),qty:nd.qty,unit:nd.unit,cat:guessCat(nd.name),auto:true,checked:existing[id]?!!existing[id].checked:false};
    const ex=existing[id];if(!ex||ex.qty!==nw.qty||ex.unit!==nw.unit||ex.name!==nw.name){put('shopping',id,nw)}n++;
  }
  for(const id of Object.keys(existing))if(!seen.has(id)&&!existing[id].checked)put('shopping',id,null);
  S.tab='shop';render();
  if(!silent)toast(items.length?(n?`${n} item${n>1?'s':''} to buy.`:'You already have everything!'):'Plan some meals first.');
}
function addMissing(id){
  const r=effRecipe(S.recipes[id]);const needs=computeNeeds([{recipe:{id,...r},factor:factorOf(r)}],pantryList());
  let n=0;for(const nd of needs){const sid='r-'+safeId(nd.key)+'-'+safeId(nd.dim);const ex=S.shopping[sid];
    if(ex&&!ex.checked&&ex.qty===nd.qty)continue;put('shopping',sid,{name:nd.name.replace(/\s*,.*$/,''),qty:nd.qty,unit:nd.unit,cat:guessCat(nd.name),auto:false,checked:false});n++}
  toast(n?`Added ${n} item${n>1?'s':''} to your list.`:'Nothing missing.');
}
function cookRecipe(id){
  const r=effRecipe(S.recipes[id]),f=factorOf(r),plan=[];const list=pantryList().filter(p=>!p.staple&&+p.qty>0);
  for(const g of r.ingredients||[]){
    if(!g.qty)continue;const b=toBase(g.qty*f,g.unit);let left=b.v;
    for(const p of list){if(left<=0)break;const pb=toBase(+p.qty,p.unit);if(pb.dim!==b.dim||!nameMatch(g.name,p.name))continue;
      const cur=plan.find(x=>x.id===p.id);const avail=pb.v-(cur?cur.used:0);if(avail<=0)continue;const take=Math.min(avail,left);
      if(cur)cur.used+=take;else plan.push({id:p.id,p,used:take});left-=take}
  }
  return plan;
}
function openCook(id){
  const r=S.recipes[id],plan=cookRecipe(id);
  openSheet(`<h2>Mark as cooked</h2><div class="mute">${esc(r.title)} — ${cfg().servings} servings</div>
  <div class="card pad">${plan.length?plan.map(x=>{const nq=Math.max(0,(+x.p.qty)-x.used/unitFactor(x.p.unit));return`<div class="ing"><span class="grow">${esc(x.p.name)}</span><span class="mute">${esc(fmtAmt(+x.p.qty,x.p.unit))} → <b style="color:var(--ink)">${esc(fmtAmt(Math.round(nq*100)/100,x.p.unit)||'0')}</b></span></div>`}).join(''):'<span class="mute">Nothing in the pantry matched these ingredients, so no quantities will change.</span>'}</div>
  <div class="row"><button class="btn pri grow" data-a="cookgo" data-id="${id}">Update pantry</button><button class="btn grow" data-a="recipe" data-id="${id}">Cancel</button></div>`);
}

  const n=Object.keys(S.recipes).length+Object.keys(S.pantry).length;const lb=lastBackup();

function buildBackup(){return{app:'our-kitchen',version:2,exported:new Date().toISOString(),pantry:S.pantry,recipes:S.recipes,shopping:S.shopping,menu:S.menu,settings:S.settings,products:S.products,guidance:S.guidance,ideas:S.ideas}}
async function exportBackup(share){
  const name='our-kitchen-backup-'+isoDate(new Date())+'.json';const file=new File([JSON.stringify(buildBackup(),null,1)],name,{type:'application/json'});
  if(share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Our Kitchen backup'});markBackup();return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  markBackup();toast('Backup saved to your Downloads folder.');
}

function importBackup(text,mode){
  let o;try{o=JSON.parse(text)}catch(e){toast('That isn’t a valid backup.');return false}
  const plain=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(!plain(o)||!COLS.some(c=>plain(o[c]))){toast('That doesn’t look like a backup from this app.');return false}
  if(mode==='replace')for(const c of COLS)for(const id of Object.keys(S[c]))put(c,id,null);
  let n=0;
  for(const c of COLS){if(!plain(o[c]))continue;for(const[id,v]of Object.entries(o[c]).slice(0,5000)){if(!plain(v)||!id||id.length>200)continue;put(c,id,v);n++}}
  toast(`Restored ${n} entries.`);return true;
}

/* ---- home, rules, item sheet, cooking mode ---- */
const cap=s=>{s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)};
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const getRules=()=>S.settings.rules&&Array.isArray(S.settings.rules.list)?S.settings.rules.list:DEFAULT_RULES;
function ruleChip(r){const c=recipeRuleCheck(r,getRules());const n=c.never.length+c.garnish.length;return n?`<span class="chip bad">Her rules: ${n} change${n>1?'s':''}</span>`:''}
function pregFlags(r){
  const flags=[];let unknown=0;
  for(const g of r.ingredients||[]){
    const gd=S.guidance[nameKey(g.name)];if(!gd||(!(gd.medical&&gd.medical.level)&&!(gd.traditional&&gd.traditional.level))){unknown++;continue}
    const m=gd.medical&&gd.medical.level,t=gd.traditional&&gd.traditional.level;
    if(['cook','limit','avoid'].includes(m)||['caution','avoid'].includes(t))flags.push({g,gd});
  }
  return{flags,unknown};
}
const LV_MED=[['','No guidance yet'],['good','Good'],['cook','Cook thoroughly'],['limit','Limit'],['avoid','Avoid']];
const LV_TRAD=[['','No guidance yet'],['welcome','Usually welcomed'],['caution','Often discouraged'],['avoid','Traditionally avoided']];
const lvLabel=(arr,k)=>(arr.find(x=>x[0]===k)||[])[1]||'';
const medClass=l=>l==='good'?'good':l==='avoid'?'bad':'warn';
const STORE_COLOR={'Whole Foods':'var(--sage)','Costco':'var(--apricot)',"Trader Joe's":'var(--duck)','Wegmans':'var(--butter)','Wilson Farms':'var(--plum)','Elias Country Store':'var(--plum)','Other':'var(--plum)'};

/* HOME */
function viewHome(){
  const today=new Date(),doc=S.menu[isoDate(mondayOf(today))]||{slots:{}},ti=(today.getDay()+6)%7,c=cfg();
  const meal=c.meals.includes('dinner')?'dinner':c.meals[0];

  if(raw){
    const r={id:slot.rid,...effRecipe(raw)},st=recipeStatus(r,factorOf(r),toVirtual(pantryList())),pf=pregFlags(r);
    h+=`<div class="hero"><div class="lab">Tonight’s ${meal}</div><h2>${esc(raw.title)}</h2><div>${raw.time?`<span class="chip">${esc(raw.time)} min</span>`:''}<span class="chip">${st.total-st.need} of ${st.total} on hand</span>${ruleChip(r)}${pf.flags.length?`<span class="chip warn">Pregnancy: ${pf.flags.length} to note</span>`:''}</div><div class="row" style="margin-top:14px"><button class="btn pri grow" data-a="startcook" data-id="${slot.rid}">Start cooking</button><button class="btn" data-a="homeslot" data-k="${ti}-${meal}">Swap ${meal}</button></div></div>`;

  }else{
    h+=`<div class="hero"><div class="lab">Tonight’s ${meal}</div><h2>Nothing planned yet</h2><div class="row wrap">${recipeList().length?`<button class="btn pri" data-a="homeslot" data-k="${ti}-${meal}">Choose a ${meal}</button><button class="btn" data-a="goto" data-t="menu">Plan my week</button>`:`<button class="btn pri" data-a="goto" data-t="recipes">Add recipes first</button>`}</div></div>`;
  }

  if(soon.length)h+='<div class="card">'+soon.map(p=>{
    const pl=planned.find(x=>(x.r.ingredients||[]).some(g=>nameMatch(g.name,p.name))),pr=S.products[nameKey(p.name)];

    const frz=!pl&&pr&&pr.freezeOk?'<span class="chip duck">Freeze it</span>':'';
    return`<div class="item" data-a="editpantry" data-id="${p.id}" style="cursor:pointer"><div class="grow"><b>${esc(p.name)}</b><div class="small mute">${why}</div></div><div style="text-align:right">${frz}${when}</div></div>`}).join('')+'</div>';
  else h+=`<div class="card pad mute">Nothing is close to its best-before date. Add dates in the pantry and I’ll watch them.</div>`;

/* ITEM SHEET */
function openItem(name){
  const key=nameKey(name),pr=S.products[key]||{},gd=S.guidance[key]||{},rule=ruleFor(name,getRules());
  const ideas=Object.entries(S.ideas).filter(([,v])=>v.key===key);

  if(rule)h+=sec('Her rule',`<div class="card pad"><div>${(rule.usage||[]).map(u=>`<span class="chip ${u==='never'?'bad':u==='flavor'?'duck':'warn'}">${esc(lvl(USAGE_OPTS,u))}</span>`).join('')}</div><div style="margin-top:6px">${esc(ruleDesc(rule))}</div></div>`);

/* COOKING MODE */
let C=null,CT=null,WL=null;
function stepHtml(txt){return esc(txt).replace(TIME_RE,(m,a,b,u)=>`<button class="tm" data-a="ctimer" data-m="${timeMinutes(m,a,b,u)}" data-l="${esc(m)}">${m}</button>`)}
function startCooking(id){
  const raw=S.recipes[id];if(!raw)return;
  C={id,step:0,checked:{},timer:null};$('#sheet').hidden=true;$('#sheetbody').innerHTML='';
  $('#cook').hidden=false;document.body.style.overflow='hidden';
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{WL=l}).catch(()=>{})}catch(e){}
  renderCook();
}
function closeCooking(){clearInterval(CT);C=null;$('#cook').hidden=true;$('#cook').innerHTML='';document.body.style.overflow='';try{if(WL)WL.release()}catch(e){}WL=null;render()}
function renderCook(){
  if(!C)return;const raw=S.recipes[C.id];if(!raw){closeCooking();return}
  const r=effRecipe(raw),steps=r.steps||[],n=steps.length,i=Math.min(C.step,Math.max(0,n-1)),txt=steps[i]||'';
  const notes=stepNotes(r,txt,i===n-1,getRules());
  const ad=raw.adapt||{};
  for(const nm of ad.leaveOut||[]){const w=toks(nm).slice(-1)[0],re=w&&aliasRe(w);if(re&&re.test(txt))notes.push({text:'You left out the '+w+' in this recipe. Skip it here.'})}
  for(const[nm,to]of Object.entries(ad.swaps||{})){const w=toks(nm).slice(-1)[0],re=w&&aliasRe(w);if(re&&re.test(txt))notes.push({text:'Use '+to+' in place of the '+w+'.'})}
  let tm='';const m=txt.match(new RegExp(TIME_RE.source,'i'));
  if(C.timer){const t=C.timer;tm=`<div class="ctimer"><div class="small"><b>${esc(t.label)}</b></div><div class="big" id="ctime">${fmtClock(t.done?0:t.paused?t.left:Math.max(0,Math.round((t.end-Date.now())/1000)))}</div>${t.done?'<div><b>Time is up</b></div>':''}<div class="row" style="justify-content:center;margin-top:8px">${t.done?'':`<button class="btn" data-a="cpause">${t.paused?'Resume':'Pause'}</button>`}<button class="btn" data-a="ccancel">${t.done?'Dismiss':'Cancel'}</button></div></div>`}
  else if(m){const mins=timeMinutes(m[0],m[1],m[2],m[3]);tm=`<div class="ctimer"><div class="big">${fmtClock(mins*60)}</div><button class="btn pri" style="margin-top:6px" data-a="ctimer" data-m="${mins}" data-l="${esc(m[0])}">Start timer</button></div>`}
  $('#cook').innerHTML=`<div class="cbar"><button class="ic" data-a="cclose" aria-label="Stop cooking">×</button><h3>${esc(raw.title)}</h3><button class="btn sm" data-a="cing">Ingredients</button></div>
  <div class="segp">${steps.map((_,k)=>`<i class="${k<i?'on':k===i?'cur':''}"></i>`).join('')}</div>
  <div class="small mute" style="padding:10px 18px 0;font-weight:800">${n?`Step ${i+1} of ${n}`:'No method steps'}</div>
  <div class="cstep">${n?stepHtml(txt):'This recipe has no method yet. Use the ingredients list, then finish.'}</div>
  ${notes.map(x=>`<div class="cnote">${esc(x.text)}</div>`).join('')}${tm}
  <div class="small mute" style="text-align:center;padding:4px 16px">Screen stays on while you cook</div>
  <div class="cnav"><button class="btn" data-a="cback" ${i===0?'disabled':''} aria-label="Previous step">Back</button><button class="btn pri grow" data-a="cnext">${i>=n-1?'Finish':'Next step'}</button></div>`;
}
function tickCook(){
  if(!C||!C.timer||C.timer.paused||C.timer.done)return;const t=C.timer,left=Math.max(0,Math.round((t.end-Date.now())/1000));t.left=left;
  const el=$('#ctime');if(el)el.textContent=fmtClock(left);
  if(left<=0){t.done=true;try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}toast('Timer done: '+t.label,6000);renderCook()}
}
function startTimer(sec,label){if(!C)return;C.timer={label,total:sec,end:Date.now()+sec*1000,left:sec,paused:false,done:false};clearInterval(CT);CT=setInterval(tickCook,1000);renderCook()}
function openCookIngredients(){
  const r=effRecipe(S.recipes[C.id]),f=factorOf(r),vp=toVirtual(pantryList());

    return`<label class="opt ${C.checked[k]?'on':''}"><input class="chk" type="checkbox" data-a="cchk" data-k="${k}" ${C.checked[k]?'checked':''}><span class="grow"><b>${esc(fmtAmt(g.qty?Math.round(g.qty*f*100)/100:0,g.unit))} ${esc(g.name)}</b><div>${tag}</div></span></label>`}).join('')||'<div class="mute">No ingredients listed.</div>'}
  <button class="btn pri" style="width:100%;margin-top:14px" data-a="close">Back to cooking</button>`);
}

  pstep:d=>{const p=S.pantry[d.id];if(!p)return;const nq=Math.max(0,Math.round(((+p.qty||0)+(+d.d)*stepOf(p))*100)/100);put('pantry',d.id,Object.assign({},p,{qty:nq}));$('#plist').innerHTML=pantryRows()},
  editpantry:d=>editPantry(d.id),
  savepantry:d=>{const name=$('#p_name').value.trim();if(!name){toast('Name is required.');return}
    const rec={name,qty:Math.max(0,+$('#p_qty').value||0),unit:$('#p_unit').value,cat:$('#p_cat').value,expires:$('#p_exp').value,staple:$('#p_staple').checked};
    put('pantry',d.id||uid(),rec);closeSheet()},
  delpantry:d=>{put('pantry',d.id,null);closeSheet()},
  sadd:()=>{const el=$('#sadd');const g=parseIng(el.value);if(!g)return;put('shopping',uid(),{name:g.name,qty:g.qty,unit:g.unit,cat:guessCat(g.name),auto:false,checked:false});el.value='';render();$('#sadd').focus()},
  scheck:(d,el)=>{const s=S.shopping[d.id];if(s){put('shopping',d.id,Object.assign({},s,{checked:el.checked}));render()}},
  sdel:d=>{put('shopping',d.id,null);render()},
  clearlist:()=>{for(const id of Object.keys(S.shopping))put('shopping',id,null);render()},
  doneshop:()=>{let n=0;for(const s of shopList().filter(s=>s.checked)){addToPantry(s.name,s.qty||1,s.unit,s.cat);put('shopping',s.id,null);n++}render();toast(`${n} item${n>1?'s':''} added to the pantry.`)},
  savesettings:()=>{const meals=[...document.querySelectorAll('input[name=s_meal]:checked')].map(x=>x.value);
    put('settings','main',{servings:Math.max(1,+$('#s_serv').value||2),meals:meals.length?meals:['dinner'],avoid:$('#s_avoid').value.split(',').map(s=>s.trim()).filter(Boolean)});closeSheet()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.type==='checkbox'){const g=A[el.dataset.a];if(g)g(el.dataset,el);return}const f=A[el.dataset.a];if(f)f(el.dataset,el,e)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;
  if(k==='rq'){S.rq=e.target.value;$('#rlist').innerHTML=recipeCards(recipeList().filter(r=>((r.title||'')+(r.tags||[]).join(' ')).toLowerCase().includes(S.rq.toLowerCase())&&(S.filter==='all'||(S.filter==='fav'?r.fav:MEALS.includes(S.filter)?(r.meals||['dinner']).includes(S.filter):true))).sort((a,b)=>(a.title||'').localeCompare(b.title||'')))}
  if(k==='pq'){S.pq=e.target.value;$('#plist').innerHTML=pantryRows()}
  if(k==='slotq'){const kk=e.target.dataset.k,v=e.target.value;openSlot(kk,v);const i=$('#slotq');i.focus();i.setSelectionRange(v.length,v.length)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='padd')A.padd();if(e.target.id==='sadd')A.sadd();if(e.target.id==='i_idea')A.addidea({n:document.querySelector('[data-a=addidea]').dataset.n})});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('Installed!')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
initStore();
</script>
</body>
</html>
